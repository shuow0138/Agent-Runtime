[project]
name = "agent-runtime"
version = "0.1.0"
description = "Fault-tolerant platform for asynchronous AI job execution."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx2",
    "ruff",
    "pre-commit",
]